name: CI

# Changes that cannot affect the compiler or its tests do not run CI: the
# documentation, which the Site and Release workflows build, ppup, and the
# machinery of the other workflows.
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "doc/**"
      - "ppup/**"
      - ".github/scripts/downloads.py"
      - ".github/scripts/index.py"
      - ".github/scripts/package.sh"
      - ".github/scripts/smoke.sh"
      - ".github/workflows/ppup.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/site.yml"
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "doc/**"
      - "ppup/**"
      - ".github/scripts/downloads.py"
      - ".github/scripts/index.py"
      - ".github/scripts/package.sh"
      - ".github/scripts/smoke.sh"
      - ".github/workflows/ppup.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run of the older one; pushes to
# master and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86_64-linux:
    name: x86_64 Linux
    uses: ./.github/workflows/ci-host.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-linux-musl

  aarch64-macos:
    name: aarch64 macOS
    uses: ./.github/workflows/ci-host.yml
    with:
      runner: macos-latest
      target: aarch64-macos-none
