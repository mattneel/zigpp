name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run of the older one; pushes to
# master and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86_64-linux:
    name: x86_64 Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # The bootstrap compiler is built without lib/; it uses the checkout's.
      ZIG_LIB_DIR: ${{ github.workspace }}/lib
    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from `git describe`, which needs the history and
          # the tags.
          fetch-depth: 0

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      # The devkit is large, and it only changes when devkit.sh moves to a new
      # one.
      - name: Restore the LLVM devkit
        uses: actions/cache@v6
        with:
          path: ~/deps
          key: devkit-x86_64-linux-musl-${{ hashFiles('.github/scripts/devkit.sh') }}

      - name: Build Zig++ from source
        run: .github/scripts/bootstrap.sh

      - name: Check formatting
        run: build-bootstrap/stage3/bin/zig build test-fmt

      - name: Test the standard library
        run: build-bootstrap/stage3/bin/zig test lib/std/std.zig -lc

      - name: Run the behavior tests
        run: build-bootstrap/stage3/bin/zig test test/behavior.zig

      # -Denable-llvm adds the cases that compile with the LLVM backend, which
      # the bootstrap compiler has.
      - name: Run the compiler test cases
        run: build-bootstrap/stage3/bin/zig build test-cases -Dskip-non-native -Denable-llvm

      # Includes the std.gpu suite: its kernels compile for NVIDIA and AMD
      # GPUs, and it skips itself on a runner without a GPU driver.
      - name: Run the standalone tests
        run: build-bootstrap/stage3/bin/zig build test-standalone -Dskip-non-native -Dskip-release
