name: CI host

# CI on one of the project's own machines, called by ci.yml: the job builds
# the compiler and runs every test suite with it. The machines keep their
# LLVM devkit under ~/deps and their Zig caches between runs, so there is no
# cache to restore and no compiler to hand from one job to another.
on:
  workflow_call:
    inputs:
      runner:
        description: Label of the self-hosted runner, wsl2, windows, or m4
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    # The repository is public and these runners are real machines, so pull
    # requests from forks never reach them; the repository also requires
    # approval before any outside contributor's workflow runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash on Windows.
        shell: bash
    env:
      # The compiler is built without lib/; it uses the checkout's.
      ZIG_LIB_DIR: ${{ github.workspace }}/lib
    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from `git describe`, which needs the history and
          # the tags, and bootstrap.sh looks for the commit of the newest
          # release.
          fetch-depth: 0

      - name: Build Zig++
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/bootstrap.sh

      # Every suite runs once the compiler is built, whether an earlier one
      # failed or not, so that a run reports all of its failures. Debug builds
      # for x86_64 use the self-hosted back end unless -fllvm asks for LLVM,
      # which release builds and most other targets use.
      - name: Standard library and behavior
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export PATH="$PWD/build-bootstrap/stage3/bin:$PATH"
          zig build test-fmt
          zig test lib/std/std.zig -lc
          zig test test/behavior.zig
          zig test lib/std/std.zig -lc -fllvm
          zig test test/behavior.zig -fllvm

      # Zig++ against C that the Clang in Zig++ compiled.
      - name: C ABI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export PATH="$PWD/build-bootstrap/stage3/bin:$PATH"
          zig build test-c-abi -Dskip-non-native -Dskip-release

      # -Denable-llvm adds the cases that compile with the LLVM back end,
      # which this compiler has.
      - name: Compiler test cases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export PATH="$PWD/build-bootstrap/stage3/bin:$PATH"
          zig build test-cases -Dskip-non-native -Denable-llvm

      # Includes the std.gpu suite, which runs its kernels on the GPU of the
      # machine: CUDA on the RTX 5090 Laptop GPU under WSL2, Metal on the M4.
      - name: Standalone
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export PATH="$PWD/build-bootstrap/stage3/bin:$PATH"
          zig build test-standalone -Dskip-non-native -Dskip-release
